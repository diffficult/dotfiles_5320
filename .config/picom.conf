
## Updated for picom v13 (yshui/picom) — GLX backend, modern rules system

#========================= Corners =========================#
# corner-radius sets the curvature of window corners.
# 0 = square corners (disabled). Increase to get rounded corners.

corner-radius = 0;

# rounded-corners-exclude is deprecated — handled in the rules block below.

#========================= Shadows =========================#
# Shadows add a drop shadow beneath windows for depth.
# Currently disabled globally; per-window overrides can be done in rules.

shadow = false;

# Shadow appearance (takes effect if shadow = true globally or per window):
shadow-radius  = 14;    # blur radius of the shadow in pixels
shadow-opacity = 0.30;  # 0.0–1.0; lower = more transparent shadow
shadow-offset-x = -12;  # horizontal offset (negative = left)
shadow-offset-y = -12;  # vertical offset (negative = up)

# shadow-exclude is deprecated — handled in the rules block below.

#========================= Fading =========================#
# Fading smoothly transitions window opacity on open/close/focus change.

fading = true;

# How much opacity changes per step (0.01–1.0).
# Lower = slower, smoother fade. Higher = snappier.
fade-in-step  = 0.03;
fade-out-step = 0.03;

# Time between fade steps in milliseconds. Lower = faster animation.
fade-delta = 5;

# fade-exclude is deprecated — slop is handled via fade = false in the rules block below.

# false = fade windows on open/close (set true to skip open/close fades).
no-fading-openclose = false;

# Workaround for ARGB window bugs in some WMs (Openbox, Fluxbox).
no-fading-destroyed-argb = true;

#========================= Opacity =========================#
# Controls window transparency. 1.0 = fully opaque, 0.0 = invisible.
# Per-window rules are in the rules block below.

frame-opacity = 1.0;  # opacity for window title bars/borders

# inactive-opacity, active-opacity, inactive-opacity-override, focus-exclude,
# and opacity-rule are all deprecated when using the rules block — see rules below.

#========================= Blurring =========================#
# Background blur behind transparent windows (e.g. terminals, rofi).
# Currently disabled (method = "none"). To enable, set method = "dual_kawase"
# and switch to the GLX backend (already done below).

blur: {
  method           = "none";  # "none" | "gaussian" | "box" | "dual_kawase"
  strength         = 0;       # blur intensity (dual_kawase: 1–20)
  background       = false;   # blur behind transparent window backgrounds
  background-frame = false;   # blur behind window frames
  background-fixed = false;   # keep blur region fixed (ignores window movement)
  kern             = "3x3box";
}

# blur-background-exclude is deprecated — handled in the rules block below.

#========================= General Settings =========================#

# --- Backend ---
# GLX uses OpenGL for rendering — faster than xrender on modern hardware.
# Intel Xe (integrated) + Mesa supports GLX via DRI3/GBM.
# xrender is a fallback for old/unsupported GPUs.
backend = "glx";

# --- VSync ---
# Synchronize redraws with the monitor's refresh rate.
# Prevents screen tearing on Intel/Mesa via DRI3 Present extension.
vsync = true;

# --- Damage tracking ---
# Only repaint the screen regions that actually changed each frame.
# Significantly reduces GPU load. Disable only if you see graphical artifacts.
use-damage = true;

# --- Fullscreen optimization ---
# Bypasses the compositor entirely for fullscreen windows (games, video).
# Eliminates compositor overhead and reduces latency when fullscreen.
unredir-if-possible = true;

# mark-wmwin-focused and mark-ovredir-focused are ignored when rules is set.
# Use focus = true in individual rules instead (see rules block).

# Try to detect windows with shaped/rounded corners in the WM.
detect-rounded-corners = true;

# Read _NET_WM_OPACITY from client windows (useful for some WMs).
detect-client-opacity = true;

# Group windows by WM_TRANSIENT_FOR (e.g. dialogs stay focused with parent).
detect-transient = true;

# Also group by WM_CLIENT_LEADER (lower priority than transient).
detect-client-leader = true;

# Log level: "trace" | "debug" | "info" | "warn" | "error"
log-level = "info";

# wintypes is ignored when rules is set — window type rules are in the rules block below.

#========================= Animations =========================#
# Window animations using picom v11+ built-in animation engine.
# Timing is controlled with cubic-bezier curves (same as CSS).

animations = (
  # Closing / hiding: quick linear fade-out
  {
    triggers = ["close", "hide"];
    opacity = {
      curve    = "linear";
      duration = 0.1;
      start    = "window-raw-opacity-before";
      end      = 0;
    };
    blur-opacity   = "opacity";
    shadow-opacity = "opacity";
  },

  # Opening / showing: spring-like scale-in + fade-in
  # cubic-bezier(0,1,1,1) gives a slight overshoot (bouncy feel)
  {
    triggers = ["open", "show"];
    opacity = {
      curve    = "cubic-bezier(0,1,1,1)";
      duration = 0.3;
      start    = 0;
      end      = "window-raw-opacity";
    };
    blur-opacity   = "opacity";
    shadow-opacity = "opacity";
    # Center the scale transform on the window
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      curve    = "cubic-bezier(0,1.3,1,1)";  # slight overshoot at 1.3
      duration = 0.3;
      start    = 0.6;
      end      = 1;
    };
    scale-y        = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # Geometry change (resize / move): smooth spring interpolation
  # cubic-bezier(0,0,0,1.28) gives an elastic overshoot on resize
  {
    triggers = ["geometry"];
    scale-x = {
      curve    = "cubic-bezier(0,0,0,1.28)";
      duration = 0.22;
      start    = "window-width-before / window-width";
      end      = 1;
    };
    scale-y = {
      curve    = "cubic-bezier(0,0,0,1.28)";
      duration = 0.22;
      start    = "window-height-before / window-height";
      end      = 1;
    };
    offset-x = {
      curve    = "cubic-bezier(0,0,0,1.28)";
      duration = 0.22;
      start    = "window-x-before - window-x";
      end      = 0;
    };
    offset-y = {
      curve    = "cubic-bezier(0,0,0,1.28)";
      duration = 0.22;
      start    = "window-y-before - window-y";
      end      = 0;
    };
    shadow-scale-x  = "scale-x";
    shadow-scale-y  = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
)

#========================= Rules =========================#
# Unified per-window rule system (replaces deprecated opacity-rule,
# shadow-exclude, focus-exclude, blur-background-exclude, rounded-corners-exclude).
# Rules are matched top-to-bottom; first match wins for each property.

rules = (
  # --- Opacity: force fully opaque for these apps ---
  # Prevents unintended transparency from global inactive-opacity rules.
  { match = "class_g = 'Bar'";             opacity = 1; focus = true; },
  { match = "class_g = 'slop'";            opacity = 1; focus = true; },  # maim screenshot
  { match = "class_g = 'XTerm'";           opacity = 1; },
  { match = "class_g = 'URxvt'";           opacity = 1; },
  { match = "class_g = 'kitty'";           opacity = 1; },
  { match = "class_g = 'Alacritty'";       opacity = 1; },
  { match = "class_g = 'Polybar'";         opacity = 1; },
  { match = "class_g = 'code-oss'";        opacity = 1; },
  { match = "class_g = 'Meld'";            opacity = 1; },
  { match = "class_g = 'TelegramDesktop'"; opacity = 1; },
  { match = "class_g = 'Joplin'";          opacity = 1; },
  { match = "class_g = 'firefox'";         opacity = 1; },
  { match = "class_g = 'Thunderbird'";     opacity = 1; },

  # --- Shadows: disable for specific windows ---
  # Widgets, overlays, and notification daemons look better without shadows.
  { match = "class_g = 'Cairo-clock' || class_g = 'CoverGloobus' || class_g = 'Tilda'";
    shadow = false; },
  { match = "name *= 'gnome-pie'";                                shadow = false; },
  { match = "class_g ?= 'Plank'";                                 shadow = false; },
  { match = "name = 'Notification' || name = 'Docky' || name = 'Kupfer'";
    shadow = false; },
  { match = "name = 'xfce4-notifyd'";                             shadow = false; },
  { match = "name *= 'VLC' || name *= 'Chromium' || name *= 'Chrome'";
    shadow = false; },
  { match = "class_g = 'Conky' || class_g = 'Synapse'";           shadow = false; },
  { match = "class_g ?= 'Notify-osd' || class_g ?= 'Cairo-dock'"; shadow = false; },
  { match = "class_g ?= 'Xfce4-notifyd' || class_g ?= 'Xfce4-power-manager'";
    shadow = false; },
  # Windows with GTK client-side decorations get their own shadow from GTK — skip picom's.
  { match = "_GTK_FRAME_EXTENTS@";                               shadow = false; },
  # Hidden/minimized windows don't need a shadow.
  { match = "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'";            shadow = false; },

  # --- Blur background: disable for these windows ---
  # Desktop and screenshot tools should never blur.
  { match = "window_type = 'desktop'"; blur-background = false; },
  { match = "class_g = 'Plank'";       blur-background = false; },
  { match = "class_g = 'slop'";        blur-background = false; },
  { match = "_GTK_FRAME_EXTENTS@";   blur-background = false; },

  # --- Corner radius: disable rounding for specific widgets ---
  # Bars and launchers typically have their own border/shape.
  { match = "class_g ?= 'rofi'";    corner-radius = 0; },
  { match = "class_g ?= 'polybar'"; corner-radius = 0; },
  { match = "class_g ?= 'tint2'";   corner-radius = 0; },

  # --- Focus: always considered focused (no inactive dimming) ---
  { match = "class_g = 'Cairo-clock'"; focus = true; },

  # --- Fade: disable for screenshot/selection tools ---
  # Replaces the deprecated fade-exclude option.
  { match = "class_g = 'slop'"; fade = false; },

  # --- Window types (replaces deprecated wintypes block) ---
  # Tooltips: fade + shadow, slightly transparent, always focused.
  { match = "window_type = 'tooltip'";
    fade = true; shadow = true; opacity = 0.75; focus = true; },
  # Docks (e.g. polybar): no shadow, clip shadows cast by windows above.
  { match = "window_type = 'dock'";
    shadow = false; clip-shadow-above = true; },
  # Drag-and-drop overlays: no shadow.
  { match = "window_type = 'dnd'";  shadow = false; },
  # Context menus: no shadow.
  { match = "window_type = 'menu'"; shadow = false; },
  # Right-click / popup menus: slightly transparent.
  { match = "window_type = 'popup_menu'";    opacity = 0.8; },
  { match = "window_type = 'dropdown_menu'"; opacity = 0.8; },
);
