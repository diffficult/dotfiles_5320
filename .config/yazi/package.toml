# Yazi package manifest for the laptop (poole).
# Mirrored from desktop live config on 2026-06-25.
#
# Setup on a fresh machine:
#   ya pkg install
#
# Notes:
#   - `rev` and `hash` are pinned to the same versions as the desktop for
#     parity. Run `ya pkg upgrade` to bump them.
#   - `audio-enter` is referenced by keymap.toml (line: plugin audio-enter)
#     but is NOT in the desktop's package.toml; it was installed manually
#     there. We declare it here so a fresh laptop install matches.
#   - `smart-enter` is intentionally OMITTED: the desktop keymap no longer
#     binds <Enter> to it (it uses `audio-enter` instead).

