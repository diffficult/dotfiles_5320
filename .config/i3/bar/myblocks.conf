command=~/.config/i3/bar/modules/$BLOCK_NAME
markup=pango
full_text=
#full_text= 
#full_text= 
align=center
#color=#599CAA
color=#7780a1
separator=false
separator_block_width=4

[window_title]
command=~/.config/i3/bar/modules/window_title 45
interval=once
signal=11
color=#7780A1
align=left

[separator]

[ssid]
command=echo "<span font_desc='SF Pro Rounded Bold'><b>$(iw dev wlan0 link | grep SSID | cut -d " " -f 2-)</b></span>"
interval=300

[wifi]
command=~/.config/i3/bar/modules/wifi
instance=wlan0
label=   
interval=300

[separator]

[disk]
#command=df -h | grep /dev/sda1 | awk '{print $5,$3,$4}'
command=df -h | grep /dev/nvme0n1p3 | awk '{print "  <span font_desc='\''SF Pro Rounded Bold'\''><b>" $5 " " $4 "</b></span>"}'
#command=~/.i3/scripts/disk | sed '1,2s/$/ free/'
interval=3600
#label=

[separator]

[temperature]
command=~/.config/i3/bar/modules/temperature -w 53 -c 65 --chip coretemp-isa-0000
label= 
interval=10

[separator]

[weather2]
command=~/.config/i3/bar/modules/weather2
interval=10800
color=#C9CCDB
# Using defaults: Mendoza coordinates, 3-hour cache
# Customize by uncommenting and modifying:
# LATITUDE=-32.89
# LONGITUDE=-68.83
# TIMEZONE=America/Argentina/Mendoza
UPDATE_INTERVAL=10800
TOOLTIP_MODE=notify
# TEMP_UNIT=C          # or "F"

[separator]

[pacman]
command=~/.config/i3/bar/modules/pacman
label=   
#label=
interval=10800

[separator]

[volume]
command=~/.config/i3/bar/modules/volume_old
# label is now generated dynamically by the script
color=#C9CCDB
interval=once
signal=10
USE_ALSA_NAME=1

[separator]

[date]
#command=echo "`date +'%d %b'`" ; [[ -z "${BLOCK_BUTTON}" ]] || gsimplecal &
command=echo "<span font_desc='SF Pro Rounded Bold'><b>`date +'%d %b'`</b></span>" ; [[ -z "${BLOCK_BUTTON}" ]] || ~/.config/i3/bar/modules/toggle_calendar.sh &
interval=28800
#label=
#label=
#label=
#color=#98D1CE
color=#C9CCDB

[time]
command=echo "<span font_desc='SF Pro Rounded Bold'><b>`date +'%H:%M'`</b></span>" ; [[ -z "${BLOCK_BUTTON}" ]] || ~/.config/i3/bar/modules/toggle_calendar.sh &
interval=60
label=  
color=#C9CCDB

[separator]

[battery]
command=~/.config/i3/bar/modules/battery
interval=60

[separator]

