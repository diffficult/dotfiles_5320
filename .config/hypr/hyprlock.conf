general {
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
    grace = 0
}

background {
    monitor =
    path = /tmp/hyprlock_bg.png
    color = rgba(25, 20, 30, 1.0)
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.4)
    inner_color = rgba(15, 15, 20, 0.75)
    font_color = rgb(240, 240, 240)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 12
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(249, 226, 175, 1.0)
    numlock_color = -1
    bothlock_color = -1
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 80
    font_family = JetBrains Mono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
