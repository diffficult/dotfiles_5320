# Night time config (10pm - 9am)
# Lock after 10 minutes, suspend 2 minutes later

general {
    lock_cmd = ~/.local/bin/hypr_scripts/hyprlock-run.sh
}

listener {
    timeout = 600  # 10 minutes
    on-timeout = ~/.local/bin/hypr_scripts/hyprlock-run.sh
}

listener {
    timeout = 720  # 12 minutes (10 + 2)
    on-timeout = wlopm --off '*'
    on-resume = wlopm --on '*'
}
